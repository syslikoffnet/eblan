name: apk

on:
  push:
    branches: [arena/b52e0652-eblan, main]
    paths:
      - game-hub/**
      - android-pack/**
      - .github/workflows/apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK-пакеты Capacitor 6
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capacitor → android-проект
        run: |
          cd android-pack
          npm install --no-audit --no-fund
          npm run add:android

      - name: Сборка debug APK
        run: |
          cd android-pack/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: eblan-box-apk
          path: android-pack/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Публикация в Release «apk»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create apk --repo "$GITHUB_REPOSITORY" --title "EBLAN BOX — APK" \
              --notes "Отладочный APK хаба с 30 играми. Ставь на телефон и играй."
          gh release upload apk android-pack/android/app/build/outputs/apk/debug/app-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
